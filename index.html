<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행정소송법 원고적격 퀴즈</title>
<meta name="description" content="행정소송법 제12조 원고적격에 관한 3문제 퀴즈">
<style>
  :root {
    --green: #1f7a4d;
    --green-dark: #155a38;
    --green-soft: #e9f5ee;
    --red: #b3372f;
    --red-soft: #fbecea;
    --ink: #1c2420;
    --muted: #5f6b65;
    --line: #dfe5e1;
    --bg: #f6f8f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif;
    line-height: 1.65;
    word-break: keep-all;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 64px;
  }
  header { margin-bottom: 28px; }
  .eyebrow {
    color: var(--green);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin: 0 0 6px;
  }
  h1 { font-size: 28px; margin: 0 0 8px; line-height: 1.3; }
  .lead { color: var(--muted); margin: 0; font-size: 15px; }

  .progress {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    font-size: 14px;
    color: var(--muted);
  }
  .bar {
    flex: 1;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar span {
    display: block;
    height: 100%;
    background: var(--green);
    transition: width 0.3s ease;
  }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px 24px;
  }
  .topic {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    color: var(--green-dark);
    background: var(--green-soft);
    border-radius: 999px;
    padding: 2px 12px;
    margin-bottom: 12px;
  }
  .scenario {
    border-left: 3px solid var(--green);
    padding: 2px 0 2px 14px;
    margin: 0 0 14px;
    color: #37423c;
    font-size: 15px;
  }
  h2 { font-size: 19px; margin: 0 0 18px; line-height: 1.5; }

  .options { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .option {
    width: 100%;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    text-align: left;
    font: inherit;
    color: inherit;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 13px 14px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .option:hover:not(:disabled) { border-color: var(--green); background: var(--green-soft); }
  .option:focus-visible { outline: 3px solid rgba(31, 122, 77, 0.35); outline-offset: 2px; }
  .option:disabled { cursor: default; }
  .num {
    flex: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    display: grid; place-items: center;
    font-size: 13px; font-weight: 700;
    color: var(--muted);
    margin-top: 1px;
  }
  .option.correct { border-color: var(--green); background: var(--green-soft); }
  .option.correct .num { background: var(--green); border-color: var(--green); color: #fff; }
  .option.wrong { border-color: var(--red); background: var(--red-soft); }
  .option.wrong .num { background: var(--red); border-color: var(--red); color: #fff; }
  .option.dim { opacity: 0.6; }

  .feedback { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); }
  .verdict { font-weight: 700; font-size: 17px; margin: 0 0 8px; }
  .verdict.ok { color: var(--green); }
  .verdict.no { color: var(--red); }
  .feedback p { margin: 0 0 10px; font-size: 15px; }
  .source { color: var(--muted); font-size: 13.5px; }

  .actions { margin-top: 20px; display: flex; justify-content: flex-end; }
  .btn {
    font: inherit;
    font-weight: 700;
    color: #fff;
    background: var(--green);
    border: 0;
    border-radius: 10px;
    padding: 12px 22px;
    cursor: pointer;
  }
  .btn:hover { background: var(--green-dark); }
  .btn:focus-visible { outline: 3px solid rgba(31, 122, 77, 0.35); outline-offset: 2px; }

  .score { font-size: 44px; font-weight: 800; color: var(--green); margin: 4px 0 4px; line-height: 1.2; }
  .score small { font-size: 20px; color: var(--muted); font-weight: 600; }
  .review { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 10px; }
  .review li {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 15px;
  }
  .mark { flex: none; font-weight: 800; }
  .mark.ok { color: var(--green); }
  .mark.no { color: var(--red); }

  footer { margin-top: 28px; color: var(--muted); font-size: 13px; }

  @media (max-width: 480px) {
    main { padding: 28px 16px 48px; }
    h1 { font-size: 23px; }
    .card { padding: 22px 16px; }
    h2 { font-size: 17px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">행정소송법 제12조</p>
    <h1>원고적격 퀴즈</h1>
    <p class="lead">누가 취소소송을 제기할 수 있을까요? 3문제로 핵심 판례 법리를 점검합니다.</p>
  </header>

  <div id="app" aria-live="polite"></div>

  <footer>
    학습용 자료입니다. 판례 요지는 이해를 돕기 위해 요약한 것이므로 정확한 문언은 판결 원문을 확인하세요.
  </footer>
</main>

<script>
  var QUESTIONS = [
    {
      topic: "법률상 이익의 의미",
      scenario: "행정소송법 제12조 전문은 “취소소송은 처분등의 취소를 구할 법률상 이익이 있는 자가 제기할 수 있다”고 규정합니다.",
      question: "여기서 말하는 ‘법률상 이익’에 관한 판례의 태도로 옳은 것은?",
      options: [
        "처분으로 침해된 권리 그 자체만을 의미하므로, 권리를 침해당한 처분의 상대방만 소를 제기할 수 있다.",
        "당해 처분의 근거 법규 및 관련 법규에 의하여 보호되는 개별적·직접적·구체적 이익을 의미한다.",
        "법규가 보호하지 않더라도 재판으로 보호할 가치가 있으면 사실상·경제적 이익도 포함한다.",
        "처분의 적법성을 다투기에 가장 적합한 이해관계를 가진 사람이면 누구에게나 인정된다."
      ],
      answer: 1,
      explanation: "판례는 ‘법률상 보호되는 이익’의 입장에 서 있습니다. 처분의 직접 상대방이 아닌 제3자라도 근거 법규·관련 법규가 보호하는 개별적·직접적·구체적 이익이 침해되면 원고적격이 인정됩니다. 반대로 공익 보호의 결과로 국민 일반이 공통으로 누리는 이익이나 간접적·사실적·경제적 이해관계에 그치는 경우에는 인정되지 않습니다.",
      source: "행정소송법 제12조 · 대법원 2006. 3. 16. 선고 2006두330 전원합의체 판결 등"
    },
    {
      topic: "환경소송과 인근 주민",
      scenario: "행정청이 환경영향평가 대상사업을 승인했습니다. 甲은 환경영향평가 대상지역 안에, 乙은 대상지역 밖에 거주하는 주민입니다. 두 사람 모두 승인처분의 직접 상대방은 아닙니다.",
      question: "甲과 乙의 원고적격에 관한 설명으로 옳은 것은?",
      options: [
        "甲과 乙 모두 처분의 상대방이 아니므로 취소소송을 제기할 수 없다.",
        "甲과 乙 모두 별도의 증명 없이 당연히 원고적격이 인정된다.",
        "甲은 환경상 이익의 침해 또는 침해 우려가 사실상 추정되어 원고적격이 인정되고, 乙은 수인한도를 넘는 환경피해를 받거나 받을 우려가 있음을 증명해야 인정된다.",
        "甲은 원고적격이 인정되지만, 乙은 피해를 증명하더라도 원고적격이 인정될 수 없다."
      ],
      answer: 2,
      explanation: "대상지역 안의 주민은 특별한 사정이 없는 한 환경상 이익에 대한 침해 또는 침해 우려가 있는 것으로 사실상 추정되어 원고적격이 인정됩니다. 대상지역 밖의 주민이라도 처분 전과 비교하여 수인한도를 넘는 환경피해를 받거나 받을 우려가 있음을 증명하면 원고적격을 인정받을 수 있습니다. 차이는 ‘인정 여부’가 아니라 ‘증명 부담’에 있습니다.",
      source: "대법원 2006. 3. 16. 선고 2006두330 전원합의체 판결 (새만금 사건)"
    },
    {
      topic: "경원자소송",
      scenario: "한 지역에 1곳만 허가할 수 있는 사업에 甲과 乙이 함께 허가를 신청했습니다. 행정청은 乙에게 허가하고, 甲에게는 거부처분을 했습니다. 甲은 자신에 대한 거부처분의 취소를 구하는 소를 제기했습니다.",
      question: "甲이 제기한 소에 관한 판례의 태도로 옳은 것은?",
      options: [
        "甲은 乙에 대한 허가처분의 취소만 구할 수 있고, 자신에 대한 거부처분은 다툴 수 없다.",
        "이미 乙에게 허가가 이루어졌으므로 거부처분이 취소되어도 甲이 허가받을 수 없어 소의 이익이 없다.",
        "甲의 불이익은 경쟁에서 탈락한 사실상의 불이익에 불과하여 원고적격이 없다.",
        "甲은 거부처분의 취소를 구할 원고적격이 있고, 취소판결이 확정되면 재심사로 허가받을 가능성을 배제할 수 없으므로 소의 이익도 있다."
      ],
      answer: 3,
      explanation: "경원관계에서 허가를 받지 못한 사람은 자신에 대한 거부처분의 직접 상대방으로서 그 취소를 구할 원고적격이 있습니다. 취소판결이 확정되면 행정청은 판결의 취지에 따라 다시 심사해야 하고, 그 결과 경쟁자에 대한 허가가 취소되고 원고가 허가받을 가능성을 배제할 수 없으므로 소의 이익도 인정됩니다.",
      source: "대법원 2015. 10. 29. 선고 2013두27517 판결"
    }
  ];

  var CIRCLED = ["①", "②", "③", "④"];
  var app = document.getElementById("app");
  var current = 0;
  var picks = [];

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function renderQuestion() {
    var q = QUESTIONS[current];
    app.innerHTML = "";

    var progress = el("div", "progress");
    progress.appendChild(el("span", "", "문제 " + (current + 1) + " / " + QUESTIONS.length));
    var bar = el("div", "bar");
    var fill = el("span");
    fill.style.width = (current / QUESTIONS.length * 100) + "%";
    bar.appendChild(fill);
    progress.appendChild(bar);
    app.appendChild(progress);

    var card = el("section", "card");
    card.appendChild(el("span", "topic", q.topic));
    card.appendChild(el("p", "scenario", q.scenario));
    card.appendChild(el("h2", "", q.question));

    var list = el("ul", "options");
    q.options.forEach(function (text, i) {
      var li = el("li");
      var btn = el("button", "option");
      btn.type = "button";
      btn.appendChild(el("span", "num", String(i + 1)));
      btn.appendChild(el("span", "", text));
      btn.addEventListener("click", function () { choose(i, card, list, fill); });
      li.appendChild(btn);
      list.appendChild(li);
    });
    card.appendChild(list);
    app.appendChild(card);
  }

  function choose(i, card, list, fill) {
    var q = QUESTIONS[current];
    var right = i === q.answer;
    picks[current] = i;

    Array.prototype.forEach.call(list.querySelectorAll(".option"), function (btn, idx) {
      btn.disabled = true;
      if (idx === q.answer) btn.classList.add("correct");
      else if (idx === i) btn.classList.add("wrong");
      else btn.classList.add("dim");
    });
    fill.style.width = ((current + 1) / QUESTIONS.length * 100) + "%";

    var fb = el("div", "feedback");
    fb.appendChild(el("p", "verdict " + (right ? "ok" : "no"),
      right ? "정답입니다" : "오답입니다 · 정답은 " + CIRCLED[q.answer]));
    fb.appendChild(el("p", "", q.explanation));
    fb.appendChild(el("p", "source", "근거: " + q.source));
    card.appendChild(fb);

    var actions = el("div", "actions");
    var last = current === QUESTIONS.length - 1;
    var next = el("button", "btn", last ? "결과 보기" : "다음 문제");
    next.type = "button";
    next.addEventListener("click", function () {
      if (last) { renderResult(); } else { current += 1; renderQuestion(); }
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    actions.appendChild(next);
    card.appendChild(actions);
    next.focus();
  }

  function renderResult() {
    var score = QUESTIONS.reduce(function (sum, q, i) {
      return sum + (picks[i] === q.answer ? 1 : 0);
    }, 0);
    var message = score === QUESTIONS.length
      ? "원고적격의 핵심 법리를 정확히 이해하고 있습니다."
      : score === 0
        ? "해설을 다시 읽고 한 번 더 도전해 보세요."
        : "틀린 문제의 해설을 확인하고 다시 풀어 보세요.";

    app.innerHTML = "";
    var card = el("section", "card");
    card.appendChild(el("span", "topic", "결과"));
    var scoreEl = el("p", "score", String(score));
    scoreEl.appendChild(el("small", "", " / " + QUESTIONS.length + " 문제 정답"));
    card.appendChild(scoreEl);
    card.appendChild(el("p", "", message));

    var review = el("ul", "review");
    QUESTIONS.forEach(function (q, i) {
      var ok = picks[i] === q.answer;
      var li = el("li");
      li.appendChild(el("span", "mark " + (ok ? "ok" : "no"), ok ? "O" : "X"));
      li.appendChild(el("span", "", (i + 1) + ". " + q.topic + " — 정답 " + CIRCLED[q.answer]));
      review.appendChild(li);
    });
    card.appendChild(review);

    var actions = el("div", "actions");
    var retry = el("button", "btn", "다시 풀기");
    retry.type = "button";
    retry.addEventListener("click", function () {
      current = 0;
      picks = [];
      renderQuestion();
    });
    actions.appendChild(retry);
    card.appendChild(actions);
    app.appendChild(card);
  }

  renderQuestion();
</script>
</body>
</html>
